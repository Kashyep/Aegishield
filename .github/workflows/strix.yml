name: strix-security-scan
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Owned staging URL (optional; scan source only when blank)
        required: false
        type: string
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash
      - name: Scan source tree
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: strix -n --target . --scan-mode quick
      - name: Scan owned staging URL
        if: ${{ inputs.target_url != '' }}
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TARGET_URL: ${{ inputs.target_url }}
        run: strix -n --target "$TARGET_URL" --scan-mode quick
      - name: Upload Strix scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-scan-results
          path: strix_runs/
          if-no-files-found: ignore

