name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - name: Contracts and goldens
        run: python tools/check_contracts.py
      - name: Agent, rules and LLM tests
        run: python -m pytest -q
        working-directory: backend
      - name: API e2e and conformance
        run: python -m pytest -q tests
      - name: Rule retrieval eval report is current
        working-directory: backend
        run: |
          python -m tests.rules_eval.run_eval > /dev/null
          git diff --exit-code app/rules/EVAL.md
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r ../backend/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: UI tests (fixture stubs)
        run: npm test
      - name: Full-stack test (live backend, recorded LLM mode)
        run: npm run test:live
      - name: Graph stubs match the backend builder
        working-directory: .
        run: |
          python frontend/scripts/gen_graph_stubs.py
          git diff --exit-code frontend/public/stubs
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aegis-demo:ci .
      - name: Smoke test same-origin UI + API
        run: |
          docker run -d --name smoke -p 8000:8000 aegis-demo:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/v1/health && break; sleep 1; done
          curl -fs localhost:8000/ | grep -q '<div id="root">'
