# SAP BTP Cloud Foundry (trial) deployment for the synthetic demo (OD-01 default (a), D-021).
# Run from the repo root after building the frontend; see ops/btp/README.md.
applications:
  - name: aegisshield-demo
    path: ../..
    memory: 512M
    disk_quota: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    health-check-type: http
    health-check-http-endpoint: /api/v1/health
    env:
      AEGIS_DEMO_MODE: "1"
      AEGIS_LLM_MODE: "off"
      AEGIS_DB_PATH: /tmp/aegis-demo.sqlite3
